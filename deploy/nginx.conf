# ─────────────────────────────────────────────────────────────────────────────
#  SentinelWA :: Nginx reverse proxy
#  /etc/nginx/sites-available/sentinelwa  →  symlink into sites-enabled/
#
#  Two things here are not optional:
#    · `proxy_buffering off` on /api/stream, or the SSE dashboard arrives in
#      bursts every few kilobytes instead of live.
#    · a long `proxy_read_timeout` on the same location, or the stream is cut
#      every 60s and the browser reconnects in a loop.
# ─────────────────────────────────────────────────────────────────────────────

upstream sentinelwa_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP: ACME challenge + permanent redirect ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name wa-gateway.corp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wa-gateway.corp.example.com;

    # Certbot writes these; see the README for the issuance command.
    ssl_certificate     /etc/letsencrypt/live/wa-gateway.corp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa-gateway.corp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;
    access_log /var/log/nginx/sentinelwa.access.log;
    error_log  /var/log/nginx/sentinelwa.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── Meta webhook. Keep this reachable from the public internet. ─────────
    location /api/webhook {
        proxy_pass http://sentinelwa_app;
        proxy_read_timeout 30s;
    }

    # ── SSE telemetry stream. Buffering here breaks the live dashboard. ─────
    location /api/stream {
        proxy_pass http://sentinelwa_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ── Internal gateway API. Restrict to office ranges if it must not be
    #    reachable from the internet — Meta only ever calls /api/webhook.
    location /api/v1/ {
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny  all;
        proxy_pass http://sentinelwa_app;
        proxy_read_timeout 60s;
    }

    # ── Operator console. Best kept on the LAN only. ────────────────────────
    location / {
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://sentinelwa_app;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://sentinelwa_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }
}
